name: CI

on:
  push:
    branches: [main, 'feature/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (typecheck, lint, unit tests, build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - name: Build
        run: npm run build
        env:
          # Placeholder values for a local-only build check; no real project is contacted.
          VITE_SUPABASE_URL: http://127.0.0.1:54321
          VITE_SUPABASE_ANON_KEY: sb_publishable_ci_placeholder

  database:
    name: Database (local Supabase, pgTAP, integration, concurrency)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: mkdir -p ci-logs
      - name: Start local Supabase stack
        # One retry absorbs transient image-pull or container start failures.
        run: |
          set -o pipefail
          if ! npx supabase start 2>&1 | tee ci-logs/start.log; then
            echo "First start attempt failed; retrying once." | tee -a ci-logs/start.log
            npx supabase stop --no-backup 2>&1 | tee -a ci-logs/start.log || true
            sleep 20
            npx supabase start 2>&1 | tee -a ci-logs/start.log
          fi
      - name: Show local database version
        run: npx supabase db query "SHOW server_version;"
      - name: Reset local database (all migrations from scratch)
        id: reset
        run: set -o pipefail; npm run db:reset 2>&1 | tee ci-logs/db-reset.log
      # The remaining suites run independently once the schema is in place,
      # so a failure in one does not hide the results of the others.
      - name: pgTAP tests
        if: always() && steps.reset.outcome == 'success'
        run: set -o pipefail; npm run db:test 2>&1 | tee ci-logs/pgtap.log
      - name: Round-robin concurrency
        if: always() && steps.reset.outcome == 'success'
        run: set -o pipefail; node scripts/test-round-robin-concurrency.mjs 2>&1 | tee ci-logs/round-robin.log
      - name: Knockout progression concurrency
        if: always() && steps.reset.outcome == 'success'
        run: set -o pipefail; node scripts/test-knockout-progression-concurrency.mjs 2>&1 | tee ci-logs/knockout.log
      - name: Legacy migration path
        if: always() && steps.reset.outcome == 'success'
        run: set -o pipefail; node scripts/test-legacy-migration.mjs 2>&1 | tee ci-logs/legacy.log
      - name: Publish failure details as annotations
        if: failure()
        run: node scripts/ci-annotate.mjs ci-logs/start.log ci-logs/db-reset.log ci-logs/pgtap.log ci-logs/round-robin.log ci-logs/knockout.log ci-logs/legacy.log
      - name: Stop local Supabase stack
        if: always()
        run: npx supabase stop --no-backup
