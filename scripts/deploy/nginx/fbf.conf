# Cópia versionada de /etc/nginx/conf.d/fbf.conf no servidor (aplicada em 2026-11-21).
# ATENÇÃO: ao criar uma rota nova no React Router (src/App.tsx), inclua-a no map
# $fbf_known_route abaixo; caso contrário ela responde 404 em produção.
# Aplicar: copiar para o servidor, sudo nginx -t e só então sudo systemctl reload nginx.
# FBF SITE (fbfhax.com). Anterior preservado em /etc/nginx/conf.d-backup/.
# - www.fbfhax.com redireciona (301) para https://fbfhax.com
# - cabeçalhos de segurança em todas as respostas
# - rotas que o site não conhece respondem 404 (com a página "não encontrada")

# Rotas do aplicativo (React Router). Qualquer outra resposta 404.
map $uri $fbf_known_route {
    default 0;
    "/" 1;
    ~^/(competicoes|times|jogadores|estatisticas|login|painel|recuperar-senha|redefinir-senha)/?$ 1;
    ~^/(competicoes|times|jogadores|partidas)/[A-Za-z0-9-]+/?$ 1;
}

server {
    server_name fbfhax.com;

    root /usr/share/nginx/fbf;
    index index.html;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https:; connect-src 'self' https://wybcbavgixfhvvmegkwc.supabase.co wss://wybcbavgixfhvvmegkwc.supabase.co; frame-src https://player.twitch.tv https://www.youtube.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

    error_page 404 /index.html;

    location = /favicon.ico {
        try_files /1389286770004463646.webp =404;
        types { }
        default_type image/webp;
    }

    location = /site.webmanifest {
        types { }
        default_type application/manifest+json;
    }

    location ^~ /assets/ {
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ @app;
    }

    location @app {
        if ($fbf_known_route = 0) {
            return 404;
        }
        rewrite ^ /index.html break;
    }

    listen [::]:443 ssl; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/fbfhax.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/fbfhax.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    server_name www.fbfhax.com;

    add_header Strict-Transport-Security "max-age=31536000" always;
    return 301 https://fbfhax.com$request_uri;

    listen [::]:443 ssl;
    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/fbfhax.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/fbfhax.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    listen 80;
    listen [::]:80;
    server_name fbfhax.com www.fbfhax.com;

    # Validação do Let's Encrypt (renovação) continua funcionando em HTTP.
    location /.well-known/acme-challenge/ {
        root /usr/share/nginx/fbf;
    }

    location / {
        return 301 https://fbfhax.com$request_uri;
    }
}
